<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskNest – Cloud Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--sf:#fff;--tx:#1b2631;--mu:#667585;--ln:#d5dde3;--ac:#0e6f8f;--act:#fff;--hi:#c2410c;--md:#a16207;--lo:#3f7d58;--col:#e3eaee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181d;--sf:#1b242b;--tx:#e6edf1;--mu:#8b9ba7;--ln:#2d3a43;--ac:#4fb3d3;--act:#0b1a21;--hi:#fb923c;--md:#facc15;--lo:#6ec595;--col:#182026}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181d;--sf:#1b242b;--tx:#e6edf1;--mu:#8b9ba7;--ln:#2d3a43;--ac:#4fb3d3;--act:#0b1a21;--hi:#fb923c;--md:#facc15;--lo:#6ec595;--col:#182026}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:7px 12px}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.hide{display:none!important}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:28px;width:min(380px,100%)}
.logo{font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 12px}
.err{color:var(--hi);min-height:20px;font-size:13px;margin:8px 0}
.link{background:none;border:0;color:var(--ac);padding:0;text-decoration:underline}
/* app */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
aside h2{font-size:13px;color:var(--mu);font-weight:600;margin:14px 0 4px}
.proj{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 10px}
.proj.on{background:var(--col);font-weight:600}
main{padding:20px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.top h1{font-size:24px;margin:0 auto 0 0;letter-spacing:-.02em}
.top input,.top select{width:auto;min-width:130px}
.stats{display:flex;flex-wrap:wrap;gap:20px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.stats b{font-size:22px;font-weight:800}.stats span{color:var(--mu);font-size:13px;display:block}
.bar{flex:1;min-width:160px;height:10px;background:var(--col);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lo);transition:width .3s}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.colm{background:var(--col);border-radius:12px;padding:10px;min-height:220px}
.colm h3{margin:2px 4px 10px;font-size:15px;display:flex;justify-content:space-between}
.colm.over{outline:2px dashed var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--lo);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card.high{border-left-color:var(--hi)}.card.medium{border-left-color:var(--md)}
.card p{margin:2px 0 0;color:var(--mu);font-size:13px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu);margin-top:8px}
.late{color:var(--hi);font-weight:600}
.empty{color:var(--mu);font-size:13px;padding:8px 4px}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);width:min(420px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--ln);flex-direction:row;flex-wrap:wrap;align-items:center}aside h2{width:100%;margin:6px 0 0}.proj{width:auto}.board{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="auth">
  <div class="box">
    <h1 class="logo">TaskNest</h1>
    <p class="sub" id="authSub">Sign in to your workspace.</p>
    <div id="nameWrap" class="hide"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err" role="alert"></div>
    <button class="pri" id="authBtn" style="width:100%">Sign in</button>
    <p class="sub" style="margin-top:14px"><span id="swText">New here?</span> <button class="link" id="swBtn">Create an account</button></p>
  </div>
</section>

<div id="app" class="hide">
  <aside>
    <div class="logo" style="font-size:22px">TaskNest</div>
    <div class="sub" id="who" style="margin:0"></div>
    <h2>Projects</h2>
    <div id="projs" style="display:contents"></div>
    <button id="newProj">New project</button>
    <button id="invite">Invite member</button>
    <div style="flex:1"></div>
    <button id="theme">Switch theme</button>
    <button id="logout">Sign out</button>
  </aside>
  <main>
    <div class="top">
      <h1 id="pname"></h1>
      <input id="q" type="search" placeholder="Search tasks" aria-label="Search tasks">
      <select id="fp" aria-label="Filter by priority"><option value="">All priorities</option><option>high</option><option>medium</option><option>low</option></select>
      <select id="fa" aria-label="Filter by assignee"></select>
      <button class="pri" id="newTask">Add task</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="board" id="board"></div>
  </main>
</div>

<dialog id="dlg">
  <h2 id="dTitle" style="margin:0 0 4px">Task</h2>
  <label for="tt">Title</label><input id="tt">
  <label for="td">Description</label><textarea id="td" rows="3"></textarea>
  <div class="two">
    <div><label for="tp">Priority</label><select id="tp"><option>low</option><option selected>medium</option><option>high</option></select></div>
    <div><label for="ts">Status</label><select id="ts"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></div>
    <div><label for="tdue">Due date</label><input id="tdue" type="date"></div>
    <div><label for="ta">Assignee</label><select id="ta"></select></div>
  </div>
  <div class="row"><button id="del" class="hide">Delete task</button><button id="cancel">Cancel</button><button class="pri" id="save">Save task</button></div>
</dialog>
<div id="toast" role="status"></div>

<script>
const TK="tasknest-token", $=id=>document.getElementById(id);
const COLS=[["todo","To do"],["doing","In progress"],["done","Done"]];
let db={users:[],projects:[],tasks:[]}, me=null, pid=null, editing=null, signup=false;

/* REST client: every call sends the JWT in the Authorization header */
async function api(path,method="GET",body){
  const r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json",Authorization:"Bearer "+(localStorage.getItem(TK)||"")},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&!path.startsWith("/auth")){localStorage.removeItem(TK);location.reload()}
  if(!r.ok)throw new Error(d.error||"Something went wrong. Try again.");
  return d}
async function refresh(){const d=await api("/bootstrap");me=d.me;db={users:d.users,projects:d.projects,tasks:d.tasks};render()}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const myProjects=()=>db.projects;
const nameOf=e=>(db.users.find(u=>u.email===e)||{}).name||"Unassigned";

/* auth */
function setMode(s){signup=s;$("nameWrap").classList.toggle("hide",!s);$("authBtn").textContent=s?"Create account":"Sign in";
  $("authSub").textContent=s?"Create your workspace.":"Sign in to your workspace.";$("swText").textContent=s?"Have an account?":"New here?";
  $("swBtn").textContent=s?"Sign in":"Create an account";$("err").textContent=""}
$("swBtn").onclick=()=>setMode(!signup);
$("authBtn").onclick=async()=>{
  try{const d=await api(signup?"/auth/signup":"/auth/login","POST",{name:$("name").value.trim(),email:$("email").value.trim(),password:$("pw").value});
    localStorage.setItem(TK,d.token);await start()}catch(e){$("err").textContent=e.message}};
async function start(){
  try{await refresh()}catch(e){localStorage.removeItem(TK);return}
  $("auth").classList.add("hide");$("app").classList.remove("hide");$("who").textContent=me.name;pid=(db.projects[0]||{}).id;render()}
$("logout").onclick=()=>{localStorage.removeItem(TK);location.reload()};
$("theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes("dark");r.dataset.theme=d?"light":"dark"};

/* render */
function render(){
  const ps=myProjects(),p=ps.find(x=>x.id===pid)||ps[0];pid=p&&p.id;
  $("projs").innerHTML=ps.map(x=>`<button class="proj ${x.id===pid?"on":""}" data-p="${x.id}">${esc(x.name)}</button>`).join("");
  $("projs").querySelectorAll("button").forEach(b=>b.onclick=()=>{pid=b.dataset.p;render()});
  if(!p)return;$("pname").textContent=p.name;
  const fa=$("fa"),cur=fa.value;fa.innerHTML='<option value="">Everyone</option>'+p.members.map(e=>`<option value="${esc(e)}">${esc(nameOf(e))}</option>`).join("");fa.value=cur;
  const all=db.tasks.filter(t=>t.pid===pid),q=$("q").value.toLowerCase(),fp=$("fp").value,fv=fa.value;
  const list=all.filter(t=>(!q||(t.title+t.desc).toLowerCase().includes(q))&&(!fp||t.prio===fp)&&(!fv||t.assignee===fv));
  const done=all.filter(t=>t.status==="done").length,pct=all.length?Math.round(done/all.length*100):0;
  const today=new Date().toISOString().slice(0,10),late=all.filter(t=>t.due&&t.due<today&&t.status!=="done").length;
  $("stats").innerHTML=`<div><b>${all.length}</b><span>Total tasks</span></div><div><b>${done}</b><span>Completed</span></div><div><b>${late}</b><span>Overdue</span></div><div class="bar" role="img" aria-label="${pct}% complete"><i style="width:${pct}%"></i></div><div><b>${pct}%</b><span>Complete</span></div>`;
  $("board").innerHTML=COLS.map(([k,l])=>{const ts=list.filter(t=>t.status===k);
    return `<div class="colm" data-s="${k}"><h3>${l}<span>${ts.length}</span></h3>`+(ts.map(t=>`<div class="card ${t.prio}" draggable="true" tabindex="0" data-id="${t.id}"><strong>${esc(t.title)}</strong>${t.desc?`<p>${esc(t.desc)}</p>`:""}<div class="meta"><span>${esc(nameOf(t.assignee))}</span><span class="${t.due&&t.due<today&&k!=="done"?"late":""}">${t.due?"Due "+t.due:"No due date"}</span></div></div>`).join("")||'<div class="empty">No tasks here. Add one or drag a card in.</div>')+"</div>"}).join("");
  document.querySelectorAll(".card").forEach(c=>{
    c.onclick=()=>openTask(c.dataset.id);c.onkeydown=e=>{if(e.key==="Enter")openTask(c.dataset.id)};
    c.ondragstart=e=>e.dataTransfer.setData("text/plain",c.dataset.id)});
  document.querySelectorAll(".colm").forEach(c=>{
    c.ondragover=e=>{e.preventDefault();c.classList.add("over")};c.ondragleave=()=>c.classList.remove("over");
    c.ondrop=async e=>{e.preventDefault();c.classList.remove("over");try{await api("/tasks/"+e.dataTransfer.getData("text/plain"),"PUT",{status:c.dataset.s});await refresh()}catch(x){toast(x.message)}}});
}
["q","fp","fa"].forEach(i=>$(i).oninput=render);

function openTask(id){const p=db.projects.find(x=>x.id===pid);editing=id;const t=db.tasks.find(x=>x.id===id)||{title:"",desc:"",prio:"medium",status:"todo",due:"",assignee:me.email};
  $("dTitle").textContent=id?"Edit task":"New task";$("tt").value=t.title;$("td").value=t.desc;$("tp").value=t.prio;$("ts").value=t.status;$("tdue").value=t.due;
  $("ta").innerHTML=p.members.map(e=>`<option value="${esc(e)}">${esc(nameOf(e))}</option>`).join("");$("ta").value=t.assignee;
  $("del").classList.toggle("hide",!id);$("dlg").showModal();$("tt").focus()}
$("newTask").onclick=()=>openTask(null);$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{const title=$("tt").value.trim();if(!title)return toast("Enter a task title.");
  const d={title,desc:$("td").value.trim(),prio:$("tp").value,status:$("ts").value,due:$("tdue").value,assignee:$("ta").value};
  try{if(editing)await api("/tasks/"+editing,"PUT",d);else await api("/projects/"+pid+"/tasks","POST",d);
    $("dlg").close();await refresh();toast("Task saved")}catch(e){toast(e.message)}};
$("del").onclick=async()=>{try{await api("/tasks/"+editing,"DELETE");$("dlg").close();await refresh();toast("Task deleted")}catch(e){toast(e.message)}};
$("newProj").onclick=async()=>{const n=(prompt("Project name")||"").trim();if(!n)return;
  try{const p=await api("/projects","POST",{name:n});await refresh();pid=p.id;render()}catch(e){toast(e.message)}};
$("invite").onclick=async()=>{const e=(prompt("Email of the registered user to add to this project")||"").trim();if(!e)return;
  try{await api("/projects/"+pid+"/members","POST",{email:e});await refresh();toast("Member added")}catch(x){toast(x.message)}};

if(localStorage.getItem(TK))start();
</script>
</body>
</html>
